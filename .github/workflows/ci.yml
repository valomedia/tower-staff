name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-npm-ci:
    uses: valomedia/github-workflows/.github/workflows/node-npm-ci.yml@dced356558fff409addc69828448854793927b4f # v1.3.0
    with:
      integration-install-command: npx playwright install --with-deps chromium
      integration-test-command: npm run test:integration
    permissions:
      contents: read
